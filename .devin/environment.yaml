initialize:
  - run: |
      set -euo pipefail
      if [ -s "$HOME/.nvm/nvm.sh" ]; then
        . "$HOME/.nvm/nvm.sh"
        nvm install 24.19.0
        nvm use 24.19.0
      fi
      npm ci --no-audit --no-fund
maintenance:
  - run: |
      set -euo pipefail
      if [ -s "$HOME/.nvm/nvm.sh" ]; then
        . "$HOME/.nvm/nvm.sh"
        nvm use 24.19.0
      fi
      npm install --prefer-offline --no-audit --no-fund
knowledge:
  - name: lint
    contents: |
      Run `npm run lint` from the repository root.
  - name: typecheck
    contents: |
      Run `npm run typecheck` from the repository root.
  - name: test
    contents: |
      Run `npm test` for the Vitest suite or `npm run check` for lint, typecheck, tests, and the production build.
  - name: startup
    contents: |
      Run `npm run dev -- --hostname 0.0.0.0 --port 3000`. The app works without secrets in deterministic demo mode. Copy `.env.example` to `.env.local` only when configuring external integrations.
